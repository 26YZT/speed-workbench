<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>标题工坊 · 本地创作</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><span class="badge">本地创作工具</span><h1>一个想法，三个标题。</h1><p>输入产品关键词，找到表达灵感。结果自动保存在这台电脑上。</p></header>
<section class="panel"><form id="generate-form" novalidate><label for="idea">你的产品想法</label><textarea id="idea" rows="3" placeholder="例如：帮助自由职业者专注工作的计时器" aria-describedby="hint"></textarea><p id="hint" class="muted">使用本地模板生成，不调用 AI 或付费服务。</p><button id="generate" type="submit">生成三个标题</button></form><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><section id="result" hidden aria-labelledby="result-heading"><h2 id="result-heading">这次的灵感</h2><ol id="titles"></ol></section></section>
<section class="panel"><div class="section-head"><h2>历史记录</h2><button id="refresh" class="secondary" type="button">刷新历史</button></div><p id="history-status" role="status"></p><p id="history-error" role="alert" hidden></p><div id="history"></div><p class="muted">展示最近 50 次生成 · 刷新页面不会清空历史</p></section><footer>本地保存，随时回看。</footer></main></body></html>
